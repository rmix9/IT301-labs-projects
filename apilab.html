<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Lab</title>
</head>
<body>
    <h1>Accessing User Information</h1>
    <h2>Click the button below to fetch random user information from the API</h2>
    <script>
        let img = document.createElement("img");
        let form = document.createElement("form");
        let button = document.createElement("button");
        let profile = document.createElement("div");
        let name = document.createElement("h2");
        let email = document.createElement("p");
        let phone = document.createElement("p");

        form.action = '#';
        button.type = 'button';
        button.textContent = 'Get User Info';
        profile.id = 'profile';

        form.appendChild(button);
        document.body.appendChild(form);
        document.body.appendChild(profile);

        profile.appendChild(img);
        profile.appendChild(name);
        profile.appendChild(email);
        profile.appendChild(phone);

        const getUserInfo = async () => {
            try {
                const response = await fetch('https://randomuser.me/api/');
                const data = await response.json();
                const user = data.results[0];

                img.src = user.picture.large;
                name.textContent = `${user.name.first} ${user.name.last}`;
                email.textContent = `Email: ${user.email}`;
                phone.textContent = `Phone: ${user.phone}`;
            } catch (error) {
                console.error('Could not fetch user info:', error);
            }
        };

        button.addEventListener('click', getUserInfo);
    </script>
</body>
</html>
